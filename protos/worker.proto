syntax = "proto3";

package worker;

// Worker Service definition - Full Master-Worker Communication
service WorkerService {
  // Register a worker with the master
  rpc RegisterWorker(RegisterRequest) returns (RegisterResponse);
  
  // Send heartbeat from worker to master
  rpc SendHeartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  
  // Send logs from worker to master (client streaming)
  rpc SendLogs(stream LogEntry) returns (SendLogsResponse);
  
  // Send metrics from worker to master (client streaming)
  rpc SendMetrics(stream MetricEntry) returns (SendMetricsResponse);
  
  // Send Kafka offsets from worker to master
  rpc SendKafkaOffsets(SendKafkaOffsetsRequest) returns (SendKafkaOffsetsResponse);
  
  // Get Kafka offsets from master for a task
  rpc GetKafkaOffsets(GetKafkaOffsetsRequest) returns (GetKafkaOffsetsResponse);
  
  // Get configuration from master
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  
  // Health check
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  
  // Bidirectional streaming for real-time communication (replaces WebSocket)
  rpc Communicate(stream WorkerMessage) returns (stream MasterMessage);

  // ---------------------------------------------------------------------
  // 数据采集模块 RPC 接口（master 侧提供给外部调用方下发任务到 worker）
  // ---------------------------------------------------------------------
  // 下发定时数据采集任务到指定 worker
  rpc DispatchScheduledTask(DispatchScheduledTaskRequest) returns (DispatchTaskResponse);
  // 下发实时日志采集任务到指定 worker
  rpc DispatchLogTask(DispatchLogTaskRequest) returns (DispatchTaskResponse);
  // 控制任务（stop / pause / resume）
  rpc ControlTask(ControlTaskRequest) returns (ControlTaskResponse);
  // 查询指定 worker 上的任务列表
  rpc ListWorkerTasks(ListWorkerTasksRequest) returns (ListWorkerTasksResponse);
}

// Worker info message
message WorkerInfo {
  string version = 1;
  string host = 2;
  int32 port = 3;
  double timestamp = 4;
}

// Register request
message RegisterRequest {
  string worker_id = 1;
  WorkerInfo info = 2;
  string signature = 3;
}

// Register response
message RegisterResponse {
  bool success = 1;
  string message = 2;
  string worker_id = 3;
  map<string, string> config = 4;
  double timestamp = 5;
}

// Heartbeat request
message HeartbeatRequest {
  string worker_id = 1;
  string status = 2;
  double timestamp = 3;
  string signature = 4;
}

// Heartbeat response
message HeartbeatResponse {
  bool success = 1;
  string message = 2;
  double timestamp = 3;
}

// Log entry
message LogEntry {
  string worker_id = 1;
  string level = 2;
  string message = 3;
  string source = 4;
  double timestamp = 5;
  map<string, string> metadata = 6;
}

// Send logs response
message SendLogsResponse {
  bool success = 1;
  string message = 2;
  int32 received_count = 3;
  double timestamp = 4;
}

// Metric entry
message MetricEntry {
  string worker_id = 1;
  string name = 2;
  double value = 3;
  string unit = 4;
  double timestamp = 5;
  map<string, string> labels = 6;
}

// Send metrics response
message SendMetricsResponse {
  bool success = 1;
  string message = 2;
  int32 received_count = 3;
  double timestamp = 4;
}

// Get config request
message GetConfigRequest {
  string worker_id = 1;
}

// Get config response
message GetConfigResponse {
  bool success = 1;
  map<string, string> config = 2;
  double timestamp = 3;
}

// Health check request
message HealthCheckRequest {
  string service = 1;
}

// Health check response
message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }
  ServingStatus status = 1;
  double timestamp = 2;
}

// Worker message (sent from worker to master via bidirectional stream)
message WorkerMessage {
  oneof message_type {
    ConfigAck config_ack = 1;
    TaskStatus task_status = 2;
    Ping ping = 3;
  }
}

// Master message (sent from master to worker via bidirectional stream)
message MasterMessage {
  oneof message_type {
    ConfigUpdate config_update = 1;
    TaskUpdate task_update = 2;
    TradeDayData trade_day_data = 3;
    Pong pong = 4;
  }
}

// Configuration acknowledgment
message ConfigAck {
  bool received = 1;
  double timestamp = 2;
}

// Task status update
message TaskStatus {
  string task_id = 1;
  string status = 2;
  string message = 3;
  double timestamp = 4;
}

// Ping message
message Ping {
  int32 sequence = 1;
  double timestamp = 2;
  string worker_id = 3;  // 用于在 Communicate 流中标识 worker 身份
}

// Configuration update
message ConfigUpdate {
  map<string, string> config = 1;
  double timestamp = 2;
}

// Task update
message TaskUpdate {
  string task_id = 1;
  string action = 2; // "create", "stop", "pause", "resume"
  string task_type = 3;
  map<string, string> config = 4;
  double timestamp = 5;
}

// Trade day data
message TradeDayData {
  repeated string trade_days = 1;
  double timestamp = 2;
}

// Pong message
message Pong {
  int32 sequence = 1;
  double timestamp = 2;
}

// Kafka partition offset
message KafkaPartitionOffset {
  int32 partition = 1;
  int64 offset = 2;
}

// Kafka topic offsets
message KafkaTopicOffsets {
  string topic = 1;
  repeated KafkaPartitionOffset partitions = 2;
}

// Send Kafka offsets request
message SendKafkaOffsetsRequest {
  string worker_id = 1;
  string task_id = 2;
  repeated KafkaTopicOffsets topics = 3;
  double timestamp = 4;
  string signature = 5;
}

// Send Kafka offsets response
message SendKafkaOffsetsResponse {
  bool success = 1;
  string message = 2;
  double timestamp = 3;
}

// Get Kafka offsets request
message GetKafkaOffsetsRequest {
  string worker_id = 1;
  string task_id = 2;
}

// Get Kafka offsets response
message GetKafkaOffsetsResponse {
  bool success = 1;
  repeated KafkaTopicOffsets topics = 2;
  double timestamp = 3;
}

// =====================================================================
// 数据采集模块消息定义
// =====================================================================

// 定时数据采集任务配置（与 worker 端 DatabaseCollectorTask / PrefectDatabaseCollectorTask
// 的 config 字段对齐）
message ScheduledTaskConfig {
  string cron_expression = 1;            // cron 调度表达式
  string adapter_type = 2;               // sql / clickhouse / influxdb / http / redis / kafka
  string adapter_config_json = 3;        // adapter 构造参数（JSON 字符串）
  string query = 4;                      // 单条 SQL（与 queries 二选一）
  repeated string queries = 5;           // 多条 SQL
  bool trade_day_only = 6;               // 仅在交易日执行
  string execution_mode = 7;             // thread / process
  string task_kind = 8;                  // database_collector / prefect_database_collector
  map<string, string> extra = 9;         // 预留扩展字段
}

// 实时日志采集任务配置
message LogTaskConfig {
  string source_type = 1;                // file / syslog / tcp / udp
  string source_config_json = 2;         // 源配置（JSON 字符串，如文件路径）
  int32 collect_interval = 3;            // 采集间隔（秒）
  int32 batch_size = 4;                  // 批次大小
  int32 report_interval = 5;             // 状态上报间隔（秒）
  map<string, string> extra = 6;         // 预留扩展字段
}

// 下发定时数据采集任务请求
message DispatchScheduledTaskRequest {
  string worker_id = 1;                  // 目标 worker
  string task_id = 2;                    // 任务 ID（为空则由 worker 生成）
  ScheduledTaskConfig config = 3;        // 任务配置
  string signature = 4;                  // 请求签名
  double timestamp = 5;
}

// 下发实时日志采集任务请求
message DispatchLogTaskRequest {
  string worker_id = 1;                  // 目标 worker
  string task_id = 2;                    // 任务 ID（为空则由 worker 生成）
  LogTaskConfig config = 3;              // 任务配置
  string signature = 4;                  // 请求签名
  double timestamp = 5;
}

// 任务下发响应（同时适用于定时 / 日志任务）
message DispatchTaskResponse {
  bool success = 1;
  string message = 2;
  string worker_id = 3;
  string task_id = 4;
  // worker 是否已在线（false 表示任务被暂存，等 worker 上线后下发）
  bool worker_online = 5;
  double timestamp = 6;
}

// 任务控制请求（stop / pause / resume）
message ControlTaskRequest {
  string worker_id = 1;
  string task_id = 2;
  // 控制动作: task_stop / task_pause / task_resume
  string action = 3;
  string signature = 4;
  double timestamp = 5;
}

// 任务控制响应
message ControlTaskResponse {
  bool success = 1;
  string message = 2;
  string worker_id = 3;
  string task_id = 4;
  bool worker_online = 5;
  double timestamp = 6;
}

// 查询 worker 任务列表请求
message ListWorkerTasksRequest {
  string worker_id = 1;
}

// 单个任务摘要
message TaskSummary {
  string task_id = 1;
  string task_type = 2;
  string status = 3;
  string execution_mode = 4;
  string config_json = 5;
  double last_updated = 6;
}

// 查询 worker 任务列表响应
message ListWorkerTasksResponse {
  bool success = 1;
  string message = 2;
  repeated TaskSummary tasks = 3;
  double timestamp = 4;
}
