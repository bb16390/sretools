[project]
name = "sretools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
    "aiosqlite>=0.22.1",
    "asynch>=0.2.0",
    "fastapi==0.141.0",
    # fastapi_amis_admin / fastapi_user_auth 已本地化 vendor 至 master/libs/,
    # 不再作为 pip 依赖安装;下方列出其原本的传递依赖,供 vendor 副本继续使用。
    "sqlalchemy-database>=0.1.1,<0.2.0",
    "aiofiles>=0.17.0",
    "jinja2>=3.0.0",
    "email-validator>=1.3.1,<3.0.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.0,<4.1.0",
    "casbin>=1.34.0",
    "greenlet>=3.3.2",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "influxdb-client>=1.40.0",
    "protobuf>=4.25.0",
    "pydantic-settings>=2.13.1",
    "redis>=5.0.0",
    "requests>=2.33.1",
    "sqlalchemy>=2.0.30,<2.1",
    "sqlmodel==0.0.19",
    "sqlmodelx==0.0.12",
    "croniter>=2.0.0",
    "websockets>=12.0",
    "confluent-kafka>=2.3.0",
    "mcp>=1.9.0",
    "apscheduler>=3.11.3",
]


[tool.ruff.format]
line-length = 88
tab-width = 4
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = []

[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple"
extra-index-url = ["https://mirrors.aliyun.com/pypi/simple"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.5",
]
